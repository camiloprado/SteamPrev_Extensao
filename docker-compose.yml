version: "3.8"

services:
  # ── API de Inferência (FastAPI) ──
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: previsor-steam-api
    ports:
      - "8000:8000"
    volumes:
      - ./resources/models:/app/resources/models:ro
      - ./resources/dados:/app/resources/dados:ro
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - previsor-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Dashboard Streamlit ──
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: previsor-steam-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - previsor-net

  # ── Bot Discord ──
  bot:
    build:
      context: .
      dockerfile: bot_discord/Dockerfile
    container_name: previsor-steam-bot
    environment:
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - previsor-net

networks:
  previsor-net:
    driver: bridge
